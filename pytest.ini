# One pytest session for the whole repository:
#   conda run -n vc --no-capture-output pytest
# Test modules are named per package (test_angio_* / test_vcornea_*) and import
# their package's modules by package name, so both packages' tests can run in
# the same process.
[pytest]
testpaths = tests/gui vivarium-angio vivarium-vcornea
