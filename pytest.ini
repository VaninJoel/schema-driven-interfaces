# Run the three suites as separate sessions:
#   conda run -n vc --no-capture-output pytest tests
#   conda run -n vc --no-capture-output pytest vivarium-angio
#   conda run -n vc --no-capture-output pytest vivarium-vcornea
# Test modules are named per package (test_angio_* / test_vcornea_*) and import
# their package's modules by package name. Known problem: with tests/ and
# vivarium-angio/ in ONE session, test_runner_executes_like_the_gui_and_records_the_permission
# has been seen to stall, rarely (not reproduced in over 25 later executions of that
# test in combined sessions). What the stalled session left behind shows where: the
# CompuCell3D child had finished and run_metadata.json was written, but no .omex
# existed, so the pytest process itself was waiting inside
# SimulationWorker._generate_omex_archive, before the archive file is opened (the
# git calls of the provenance record, or reading the Zarr store for metrics.csv).
# Which of the two is not known. Since then the git calls can neither wait without
# limit nor take .git/index.lock (utils/provenance.py, tests/test_provenance_git.py);
# the Zarr read is unchanged. faulthandler_timeout below makes the next
# occurrence print every thread's stack instead of stalling silently.
# Each suite passes on its own.
[pytest]
testpaths = tests vivarium-angio vivarium-vcornea
# Dump all thread stacks to stderr when one test (fixtures included) runs longer
# than this many seconds. It only reports; the test is not interrupted. The
# longest legitimate item is the V-Cornea real-model fixture (several minutes).
faulthandler_timeout = 1200
# E2E_test.py launches full-length simulations; run it by hand, never in the suite.
addopts = --ignore=vivarium-vcornea/E2E_test.py
