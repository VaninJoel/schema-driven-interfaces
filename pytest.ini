# Run the three suites as separate sessions:
#   conda run -n vc --no-capture-output pytest tests
#   conda run -n vc --no-capture-output pytest vivarium-angio
#   conda run -n vc --no-capture-output pytest vivarium-vcornea
# Test modules are named per package (test_angio_* / test_vcornea_*) and import
# their package's modules by package name. Known problem: with tests/ and
# vivarium-angio/ in ONE session, an in-process Angio run late in the session
# has been seen to stall (cause not yet found; no pair of files reproduces it).
# Each suite passes on its own.
[pytest]
testpaths = tests vivarium-angio vivarium-vcornea
# E2E_test.py launches full-length simulations; run it by hand, never in the suite.
addopts = --ignore=vivarium-vcornea/E2E_test.py
