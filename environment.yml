# Conda environment for the Schema-Driven Interfaces monorepo.
#
#   conda env create -f environment.yml      # creates env "vc"
#   conda activate vc
#
# The env is named "vc" to match the GUI's CC3D launcher default
# (cc3d_conda_env_name='vc'), so simulations run with no extra configuration.
#
# CompuCell3D is conda-only and pulls its own Qt/PyQt5 stack, which the PyQt5
# GUIs reuse. Python 3.12 + CompuCell3D 4.7.0 is the combination the model was
# developed and validated against.
#
# Tip: a recent conda (>=23.10, libmamba solver) resolves this quickly; older
# conda is much faster if you `conda install -n base conda-libmamba-solver` or
# use `mamba env create -f environment.yml` instead.
name: vc
channels:
  - conda-forge
  - compucell3d
dependencies:
  - python=3.12
  - compucell3d=4.7.0
  # GUI toolkit. CompuCell3D already pulls a PyQt5/Qt stack, but the GUIs
  # `import PyQt5` directly, so we list it explicitly rather than rely on a
  # transitive dependency that a future CC3D build could drop. The solver
  # unifies this with CC3D's own Qt requirement.
  - pyqt
  # Lets the GUI kill the whole CC3D subprocess tree cleanly on Cancel
  # (cross-platform); without it, conda+CC3D grandchildren can linger.
  - psutil
  # data / analysis stack shared by both GUIs
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - fastparquet
  - pyarrow
  - zarr
  - scikit-image
  # PDF generation for the OMEX combo/summary reports (make_omex_*_report.py,
  # triggered from the GUI after a run). Without it the run itself still
  # succeeds, but the report step fails with "No module named 'reportlab'".
  - reportlab
  - pip
  - pip:
      - vivarium-core
      # editable installs of the local wrapper packages (paths are relative to
      # this file, i.e. the repository root). The [validation] extra pulls
      # biosimulators-utils (pinned) so the COMBINE/OMEX + SED-ML conformance
      # check in each package's test_omex_validation.py is reproducible on a
      # fresh checkout rather than a manual pip-install. The extra also pins
      # setuptools<81 because biosimulators-utils -> kisao still imports
      # pkg_resources, which setuptools>=81 removed.
      - -e ./vivarium-vcornea[validation]
      - -e ./vivarium-angio[validation]
