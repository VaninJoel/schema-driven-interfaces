[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-angio"
version = "0.0.1"
authors = [
  { name="Joel Vanin", email="jvanin@iu.edu" },
]
description = "A Vivarium wrapper for the Angiogenesis simulation."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Backs the COMBINE/OMEX + SED-ML conformance check in test_angio_omex_validation.py.
# Pinned so the standards-validation claim is reproducible on a fresh checkout,
# not a manual pip-install someone has to know to do.
validation = [
    "biosimulators-utils>=0.2.3",
    # biosimulators-utils -> kisao imports pkg_resources, which setuptools>=81
    # removed; pin below the removal so the COMBINE validator imports cleanly.
    "setuptools<81",
]

[project.urls]
"Homepage" = "https://github.com/joelvanin/vivarium-angio"
"Bug Tracker" = "https://github.com/joelvanin/vivarium-angio/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vivarium_angio*"]
