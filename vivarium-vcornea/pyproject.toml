# This file is part of the new standard for Python project metadata.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-vcornea"
version = "0.1.0"
authors = [{name = "Joel Vanin", email = "jvanin@iu.edu"}]
description = "A Vivarium wrapper for the vCornea CompuCell3D model."
readme = "README.md"
requires-python = ">=3.9"


dependencies = [
    "vivarium-core",
    "pandas",
    "fastparquet",
    "pytest",
]

[project.optional-dependencies]
# Backs the COMBINE/OMEX + SED-ML conformance check in test_omex_validation.py.
# Pinned so the standards-validation claim is reproducible on a fresh checkout,
# not a manual pip-install someone has to know to do.
validation = [
    "biosimulators-utils>=0.2.3",
    # biosimulators-utils -> kisao imports pkg_resources, which setuptools>=81
    # removed; pin below the removal so the COMBINE validator imports cleanly.
    "setuptools<81",
]

[project.urls]
Homepage = "https://github.com/YourUsername/vivarium-vcornea"
Issues = "https://github.com/YourUsername/vivarium-vcornea/issues"

[tool.setuptools.packages.find]
include = ["vivarium_vcornea*"]
