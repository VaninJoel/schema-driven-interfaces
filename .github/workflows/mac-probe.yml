# Probe: which libc++ lets CompuCell3D 4.7.0 load on Apple Silicon?
name: mac-probe

on:
  workflow_dispatch:
  push:
    branches: [ci/clean-machine]
    paths: ['.github/workflows/mac-probe.yml']

jobs:
  probe:
    name: libcxx ${{ matrix.libcxx }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        libcxx: ['14', '15', '16', '17', '18', '19']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
      - name: Create a minimal environment with this libc++
        run: |
          conda create -y -n p -c conda-forge -c compucell3d python=3.12 compucell3d=4.7.0 "libcxx=${{ matrix.libcxx }}"
          conda list -n p | grep -E "^(libcxx|cc3d|compucell3d|llvm-openmp|python) "
      - name: Load the CompuCell3D extension module
        run: |
          conda run -n p --no-capture-output python -c "from cc3d.cpp import CompuCell; import cc3d; print('LOADED', cc3d.__version__)"
